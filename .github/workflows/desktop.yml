name: Desktop app

# Builds standalone OpenDrop desktop apps (no Python needed) for Windows, macOS
# and Linux. Runs on demand and for version tags (v*); tagged builds are
# attached to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: OpenDrop-windows.zip
          - os: macos-latest
            archive: OpenDrop-macos.zip
          - os: ubuntu-latest
            archive: OpenDrop-linux.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name OpenDrop --paths .
          --collect-data opendrop --collect-submodules opendrop
          packaging/opendrop_gui.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OpenDrop -DestinationPath ${{ matrix.archive }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent OpenDrop.app ../${{ matrix.archive }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} OpenDrop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
